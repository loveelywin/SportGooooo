<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Exclusive Offers - Claim Now</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0a0e17 0%, #101a2c 100%);
    color: #e8edf5;
    min-height: 100vh;
    line-height: 1.6;
    padding-bottom: 40px;
    overflow-x: hidden;
}

.hero {
    text-align: center;
    padding: 40px 20px 30px;
    background: linear-gradient(180deg, #0f1a2e 0%, transparent 100%);
    border-bottom: 2px solid #00e676;
}
.hero-icon { font-size: 48px; margin-bottom: 10px; animation: pulse 1.8s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }
.hero h1 { font-size: 28px; color: #fff; font-weight: 800; margin-bottom: 8px; }
.hero h1 span { color: #00e676; }
.hero p { color: #9aabc2; font-size: 14px; max-width: 600px; margin: 0 auto; }
.badge {
    display: inline-block; background: #ff1744; color: #fff;
    font-size: 11px; font-weight: 800; padding: 5px 14px;
    border-radius: 20px; text-transform: uppercase; letter-spacing: 1px;
    margin-top: 14px; animation: blink 1.2s infinite;
}
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.6;} }

.stats-bar {
    max-width: 1000px; margin: 0 auto; padding: 16px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.stat-box {
    background: #101a2c; border: 1px solid #1c2a44;
    border-radius: 10px; padding: 14px; text-align: center;
    position: relative; overflow: hidden;
}
.stat-box::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 100%; height: 3px;
}
.stat-box.opened::before { background: linear-gradient(90deg, #00e676, #00b85e); }
.stat-box.clicked::before { background: linear-gradient(90deg, #ff1744, #d50000); }
.stat-label {
    font-size: 11px; color: #7a8ba3; text-transform: uppercase;
    letter-spacing: 1px; font-weight: 700; margin-bottom: 4px;
}
.stat-value { font-size: 28px; font-weight: 800; line-height: 1; }
.stat-box.opened .stat-value { color: #00e676; }
.stat-box.clicked .stat-value { color: #ff1744; }
.stat-total { font-size: 12px; color: #7a8ba3; margin-left: 4px; }

.container { max-width: 1000px; margin: 0 auto; padding: 10px 16px 30px; }
.section-title {
    font-size: 18px; color: #fff; font-weight: 800; margin-bottom: 18px;
    padding-left: 12px; border-left: 4px solid #00e676;
    display: flex; align-items: center; gap: 8px;
}
.offer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 800px) { .offer-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) {
    .offer-grid { grid-template-columns: 1fr; }
    .hero h1 { font-size: 22px; }
    .stat-value { font-size: 22px; }
}

.offer-card {
    background: #101a2c; border: 1px solid #1c2a44;
    border-radius: 12px; padding: 18px;
    display: flex; flex-direction: column; gap: 10px;
    transition: transform 0.2s, border-color 0.3s, box-shadow 0.3s, background 0.3s;
    position: relative; overflow: hidden;
}
.offer-card::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 100%; height: 3px;
    background: linear-gradient(90deg, #00e676, #ff1744);
    transition: background 0.3s;
}
.offer-card.clicked {
    border-color: #00e676;
    background: #0f2a1e;
    box-shadow: 0 0 20px rgba(0, 230, 118, 0.25);
}
.offer-card.clicked::before { background: #00e676; }
.offer-number {
    position: absolute; top: 10px; right: 12px;
    font-size: 11px; font-weight: 800; color: #00e676;
    background: rgba(0, 230, 118, 0.1);
    padding: 3px 8px; border-radius: 10px;
}
.offer-card.clicked .offer-number { background: rgba(0, 230, 118, 0.25); }
.offer-icon { font-size: 28px; margin-top: 6px; }
.offer-card h3 { font-size: 15px; color: #fff; font-weight: 700; line-height: 1.3; }
.offer-card p { font-size: 12px; color: #7a8ba3; margin-bottom: 4px; }
.offer-meta {
    display: flex; gap: 10px; flex-wrap: wrap;
    font-size: 11px; color: #00e676; font-weight: 700; margin-bottom: 6px;
}
.offer-btn {
    display: block; width: 100%; background: #ff1744;
    color: #fff !important; text-align: center; padding: 11px;
    border-radius: 8px; font-weight: 800; font-size: 13px;
    text-transform: uppercase; text-decoration: none;
    letter-spacing: 0.5px; margin-top: auto;
    transition: background 0.3s, color 0.3s, transform 0.1s;
    cursor: pointer; border: none;
    pointer-events: none;
}
.offer-btn.clicked-btn {
    background: #00e676 !important;
    color: #0a0e17 !important;
    box-shadow: 0 0 15px rgba(0, 230, 118, 0.6);
}

.footer {
    text-align: center; padding: 30px 16px; color: #7a8ba3;
    font-size: 12px; border-top: 1px solid #1c2a44; margin-top: 30px;
}
.footer a { color: #00e676; text-decoration: none; }
</style>
</head>
<body>

    <div class="hero-icon">🎁</div>
    <h1>Exclusive <span>Offers</span> Just For You</h1>
    <p>All offers are opening automatically. Please wait...</p>

<div class="stats-bar">

    </div>

    </div>
</div>

<div class="container">

<footer class="footer">

const AUTO_CLICK_START_DELAY = 1000;
const AUTO_CLICK_INTERVAL = 1000;
const AUTO_CLICK_LIMIT = 20;

let openedCount = 0;
let clickedCount = 0;

const openedCountEl = document.getElementById('openedCount');
const clickedCountEl = document.getElementById('clickedCount');

function updateStats() {
    openedCountEl.textContent = openedCount;
    clickedCountEl.textContent = clickedCount;
}

const grid = document.getElementById('offerGrid');
OFFERS.forEach((offer, i) => {
    const card = document.createElement('div');
    card.className = 'offer-card';
    card.id = 'card-' + i;
    card.innerHTML = `
        <span class="offer-number">#${i + 1}</span>
        <div class="offer-icon">${offer.icon}</div>
        <h3>${offer.title}</h3>
        <p>${offer.desc}</p>
        <div class="offer-meta"><span>✅ Verified</span><span>⚡ ${offer.tag}</span></div>
        <a class="offer-btn auto-offer-btn"
           href="${offer.url}"
           target="_blank"
           rel="nofollow sponsored noopener"
           data-index="${i}">Claim Now ▶</a>
    `;
    grid.appendChild(card);
});

const buttons = document.querySelectorAll('.auto-offer-btn');

function openOffer(index) {
    const btn = buttons[index];
    const card = document.getElementById('card-' + index);
    if (!btn) return;
    if (btn.classList.contains('clicked-btn')) return;

    clickedCount++;
    updateStats();

    const win = window.open(btn.href, '_blank');
    if (win) {
        openedCount++;
        updateStats();
    }

    btn.classList.add('clicked-btn');
    btn.innerHTML = '✓ Opened';
    card.classList.add('clicked');
}

let autoIndex = 0;

function autoClickNext() {
    if (autoIndex >= AUTO_CLICK_LIMIT || autoIndex >= buttons.length) {
        return;
    }

    openOffer(autoIndex);
    autoIndex++;

    if (autoIndex < AUTO_CLICK_LIMIT && autoIndex < buttons.length) {
        setTimeout(autoClickNext, AUTO_CLICK_INTERVAL);
    }
}

window.addEventListener('load', () => {
    document.getElementById('year').textContent = new Date().getFullYear();
    setTimeout(autoClickNext, AUTO_CLICK_START_DELAY);
});

buttons.forEach((btn) => {
    btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        return false;
    });
});
